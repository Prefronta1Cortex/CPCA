[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpca"
version = "0.2.0"
description = "Complex PCA of spike phase: assemblies with internal timing from reactivation events"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "h5py", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["cpca*", "sim*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
